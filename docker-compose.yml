version: "3.9"

services:
  backend:
    build:
      context: .
      target: backend
    container_name: windpulse-backend
    ports:
      - "8002:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: ""   # Empty = use relative /api path via nginx proxy
    container_name: windpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
